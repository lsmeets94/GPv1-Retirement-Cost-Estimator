name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create local.settings.json for API
        run: |
          echo '{"IsEncrypted":false,"Values":{"AzureWebJobsStorage":"","FUNCTIONS_WORKER_RUNTIME":"node"}}' \
            > apps/api/local.settings.json

      # Requires the AZURE_STATIC_WEB_APPS_API_TOKEN secret.
      # To obtain it:
      #   1. Deploy the ARM template in infra/azuredeploy.json (or create the
      #      Static Web App manually in the Azure portal).
      #   2. Open the Static Web App resource → Manage deployment token.
      #   3. Copy the token and add it as a repository secret named
      #      AZURE_STATIC_WEB_APPS_API_TOKEN (Settings → Secrets → Actions).
      - name: Deploy to Azure Static Web Apps
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # The monorepo is pre-built above; skip_app_build tells the action to
          # use the already-built output instead of running a second build.
          app_location: apps/web
          api_location: apps/api
          output_location: dist
          skip_app_build: true
          skip_api_build: true
